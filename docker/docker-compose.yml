# Partie 1 - Personne 1 : Kafka (KRaft), Spark Master et 2 Workers.
# Lancement complet (avec MinIO + Jupyter de la Personne 2) :
#   docker compose -f docker-compose.yml -f docker-compose.storage.yml up -d

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: pedali-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "29092:29092"   # acces depuis l'hote (producer.py)
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [pedali-net]

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: pedali-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: >
      --bootstrap-server kafka:9092 --create --if-not-exists
      --topic trips --partitions 3 --replication-factor 1
    networks: [pedali-net]

  spark-master:
    image: apache/spark:3.5.3
    container_name: pedali-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"
    networks: [pedali-net]

  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: pedali-spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2g --webui-port 8081
    depends_on: [spark-master]
    ports:
      - "8081:8081"
    networks: [pedali-net]

  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: pedali-spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2g --webui-port 8082
    depends_on: [spark-master]
    ports:
      - "8082:8082"
    networks: [pedali-net]

volumes:
  kafka-data:

networks:
  pedali-net:
    name: pedali-net
